<div class="sp-backdrop" (click)="onBackdrop()" aria-hidden="true"></div>

<section
  #panel
  class="sp"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="title() ? titleId : null"
  [attr.inert]="opened() ? null : ''"
  tabindex="-1"
  (transitionend)="onTransitionEnd($event)"
>
  <header class="sp__header">
    <div class="sp__heading">
      @if (title()) {
        <h2 class="sp__title" [id]="titleId">{{ title() }}</h2>
      }
      @if (subtitle()) {
        <p class="sp__subtitle">{{ subtitle() }}</p>
      }
      <ng-content select="[panelHeader]" />
    </div>
    <button type="button" class="sp__close" (click)="closed.emit()" aria-label="Close panel">
      <i class="isax isax-close-circle" aria-hidden="true"></i>
    </button>
  </header>

  <div class="sp__body">
    @if (rendered()) {
      <ng-content />
    }
  </div>

  <footer class="sp__footer">
    <ng-content select="[panelFooter]" />
  </footer>
</section>
